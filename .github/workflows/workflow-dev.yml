name: Dev CI/CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  IMAGE_NAME: xeulbn/algorithmcampus
  IMAGE_TAG: dev
  CONTAINER_NAME: algorithmcampus-dev

jobs:
  ci:
    name: Build Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐시 설정
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 및 테스트
        run: ./gradlew clean build -x test
        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
          DEV_DB_USERNAME: ${{ secrets.DEV_DB_USERNAME }}
          DEV_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}

      - name: DockerHub 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Docker 이미지 빌드
        if: github.event_name == 'push'
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Docker 이미지 푸시
        if: github.event_name == 'push'
        run: docker push $IMAGE_NAME:$IMAGE_TAG

  cd:
    name: Deploy to Dev Server
    needs: ci
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: 배포 서버에서 Docker 이미지 pull
        run: docker pull $IMAGE_NAME:$IMAGE_TAG

      - name: 기존 컨테이너 중지 및 삭제
        run: |
          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true

      - name: 새 컨테이너 실행
        run: |
          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e DEV_DB_URL=${{ secrets.DEV_DB_URL }} \
            -e DEV_DB_USERNAME=${{ secrets.DEV_DB_USERNAME }} \
            -e DEV_DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }} \
            -p 8081:8081 \
            $IMAGE_NAME:$IMAGE_TAG

      - name: 사용하지 않는 이미지 정리
        run: docker image prune -af || true