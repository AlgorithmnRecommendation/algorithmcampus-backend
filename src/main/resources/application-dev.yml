spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

  thymeleaf:
    cache: true

server:
  servlet:
    session:
      cookie:
        secure: true